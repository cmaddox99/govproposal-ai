[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-agents-sync"
version = "1.0.0"
requires-python = ">=3.10"
description = "AGENTS.md drift detection and sync tool for hangar-ai-constitution adopters"
dependencies = [
    "click>=8.1",
]

[project.scripts]
aa-agents-sync = "aa_agents_sync.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "click",
]

[tool.hatch.build.targets.wheel]
packages = ["aa_agents_sync"]

[tool.pytest.ini_options]
addopts = "--cov=aa_agents_sync --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
