# Product Domain Laws
# Prefix: PRD
# Source: constitution/base/PRODUCT-CONSTITUTION.md

domain: product
prefix: PRD
version: "2.0.0"
authority: American Airlines Product Leadership

description: |
  Product laws governing what we build and why. Ensures customer-centric 
  development, evidence-based decisions, and alignment with American Airlines 
  business objectives.

core_principles:
  - Customer problems drive product decisions
  - Evidence over opinion
  - Outcomes over outputs
  - Iterative discovery and delivery
  - Accessibility and inclusion

articles:
  I:
    title: Foundational Principles
    non_negotiable: [PRD-1.2, PRD-1.5]
    laws:
      - PRD-1.1  # Customer-Centric Law
      - PRD-1.2  # Problem-First Law (NON-NEGOTIABLE)
      - PRD-1.3  # Outcome-Driven Law
      - PRD-1.4  # Continuous Discovery Law
      - PRD-1.5  # Evidence-Based Decision Law (NON-NEGOTIABLE)

  II:
