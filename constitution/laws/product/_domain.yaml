      - PRD-2.3  # Jobs-to-be-Done Law
      - PRD-2.4  # Competitive Analysis Law
      - PRD-2.5  # Discovery Stage-Gate Law (NON-NEGOTIABLE)
      - PRD-2.6  # Multi-Cognition Phase Gate Jury Law (NON-NEGOTIABLE)

