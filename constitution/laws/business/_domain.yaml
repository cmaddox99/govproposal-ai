    laws:
      - BUS-4.1  # Privacy by Design Law
      - BUS-4.2  # Consent Management Law
      - BUS-4.3  # Data Subject Rights Law (NON-NEGOTIABLE)
      - BUS-4.4  # Privacy Notice Law
      - BUS-4.5  # Privacy Impact Assessment Law

  V:
    title: Security Governance Laws
    status: deferred
