# Business Domain Laws
# Prefix: BUS
# Source: constitution/base/BUSINESS-CONSTITUTION.md

domain: business
prefix: BUS
version: "2.0.0"
authority: American Airlines Compliance & Legal

description: |
  Business laws governing compliance, data governance, privacy, risk management,
  and aviation-specific regulatory requirements. Ensures all software development
  adheres to legal, regulatory, and corporate policy requirements.

priority_hierarchy:
  1: Legal Compliance - FAA, TSA, DOT, GDPR, CCPA requirements
  2: Safety - Passenger and operational safety
  3: Privacy - Customer data protection
  4: Security - System and data security
  5: Business Continuity - Operational resilience
  6: Efficiency - Operational optimization

articles:
  I:
    title: Foundational Principles
    non_negotiable: [BUS-1.1]
    laws:
      - BUS-1.1  # Priority Hierarchy Law (NON-NEGOTIABLE)
      - BUS-1.2  # Risk-Based Approach Law
      - BUS-1.3  # Accountability Law
      - BUS-1.4  # Transparency Law
      - BUS-1.5  # Continuous Improvement Law

  II:
    title: Compliance Framework Laws
    non_negotiable: [BUS-2.1, BUS-2.2, BUS-2.3]
    laws:
      - BUS-2.1  # FAA Compliance Law (FAR, DO-178C)
      - BUS-2.2  # Control Framework Law (NON-NEGOTIABLE)
      - BUS-2.3  # DOT Consumer Protection Law
      - BUS-2.4  # Evidence Collection Law

  III:
    title: Data Governance Laws
    non_negotiable: [BUS-3.1, BUS-3.6]
    laws:
