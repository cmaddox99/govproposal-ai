      - BUS-3.2  # Data Inventory Law
      - BUS-3.3  # Data Retention Law
      - BUS-3.4  # Data Quality Law
      - BUS-3.5  # Cross-Border Data Transfer Law
      - BUS-3.6  # Monetary Precision Law (NON-NEGOTIABLE)

  IV:
    title: Privacy Laws
