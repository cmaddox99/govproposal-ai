# Engineering Domain Laws
# Prefix: ENG
# Source: constitution/base/ENGINEERING-CONSTITUTION.md

domain: engineering
prefix: ENG
version: "2.0.0"
authority: American Airlines IT Engineering Leadership

description: |
  Universal engineering laws that apply to ALL American Airlines projects 
  regardless of technology stack. Individual projects adopt this constitution 
  and extend it with project-specific context (language, frameworks, tools, domain).

priority_hierarchy:
  1: Security - Protect data, systems, and users
  2: Correctness - Code does what it's supposed to do
  3: Reliability - System works consistently under load and failure
  4: Maintainability - Code is readable, testable, and changeable
  5: Performance - System responds within acceptable limits
  6: Developer Experience - Engineers can work efficiently

