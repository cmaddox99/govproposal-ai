# ── DEMO PROFILE ─────────────────────────────────────────────────────────────
# Overrides Oracle + SMTP + Partner keys with H2 in-memory equivalents.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# This profile exists solely for local workshop demonstrations.

# H2 in-memory database (replaces Oracle)
spring.datasource.url=jdbc:h2:mem:loyaltydb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail — disabled for demo
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=demo@aa.com
spring.mail.password=demo
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Partner API keys — stub values for demo
partner.hertz.api.key=DEMO_HERTZ_KEY
partner.marriott.api.key=DEMO_MARRIOTT_KEY
partner.citibank.api.key=DEMO_CITIBANK_KEY

# Logging — less noise in demo
logging.level.com.aa.loyalty=INFO
logging.level.org.hibernate.SQL=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
