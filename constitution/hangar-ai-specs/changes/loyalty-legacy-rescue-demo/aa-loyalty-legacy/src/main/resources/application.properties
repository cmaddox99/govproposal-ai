# AA AAdvantage Loyalty Platform - Application Properties
# ENG-6.7 REMEDIATED (Phase 4): All credentials read from environment variables.
# Set the following env vars in your deployment environment:
#   LOYALTY_DB_URL, LOYALTY_DB_USER, LOYALTY_DB_PASS
#   LOYALTY_SMTP_HOST, LOYALTY_SMTP_USER, LOYALTY_SMTP_PASS
#   HERTZ_API_KEY, MARRIOTT_API_KEY, CITIBANK_API_KEY

# Server
server.port=8080
server.servlet.context-path=/loyalty

# Oracle DataSource — credentials from environment
spring.datasource.url=${LOYALTY_DB_URL:jdbc:oracle:thin:@localhost:1521:AADVDEV}
spring.datasource.username=${LOYALTY_DB_USER:loyalty_app}
spring.datasource.password=${LOYALTY_DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.open-in-view=true

# Mail (SMTP) — credentials from environment
spring.mail.host=${LOYALTY_SMTP_HOST:smtp.aa.com}
spring.mail.port=587
spring.mail.username=${LOYALTY_SMTP_USER:aadvantage-noreply@aa.com}
spring.mail.password=${LOYALTY_SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Partner API keys — from environment
partner.hertz.api.key=${HERTZ_API_KEY}
partner.marriott.api.key=${MARRIOTT_API_KEY}
partner.citibank.api.key=${CITIBANK_API_KEY}

# Sonar
sonar.projectKey=aa-loyalty-legacy
sonar.projectName=AA AAdvantage Loyalty (Legacy)
sonar.host.url=http://localhost:9000

# Logging
logging.level.com.aa.loyalty=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
