# Android Kotlin Avatar Manifest
# Defines stack configuration and law specializations
# Authority: Jeroen Mols (jeroenmols.com), Philipp Hauer (phauer.com),
#            Fernando Cejas (fernandocejas.com), Google Now in Android (nowinandroid)

avatar:
  id: avatar-android-kotlin
  type: technology
  name: Android / Kotlin
  version: "1.3.0"

stack:
  language: Kotlin 2.1.0
  ui: Jetpack Compose (808 files) + legacy Views/XML (migration in progress)
  minimum_sdk: 26   # Android 8.0 — Keystore symmetric key support
  compile_sdk: 36   # Android 16
  target_sdk: 36    # Android 16
  build_tool: Gradle (Groovy DSL for app modules; version catalog via libs.versions.toml)
  annotation_processing: kapt (Dagger) + ksp (Room, Glide)
  testing:
    unit: JUnit 4 (dominant — 416 files; JUnit 5 not yet adopted)
    unit_kotlin: MockK 1.13.12 + Turbine 1.1.0
    integration: Robolectric + Hilt testing
    ui: Espresso + Compose testing
    cicd: gradlew direct (no fastlane in repo)
  architecture: MVVM + Clean Architecture (Cejas)
  di: Dagger 2 (56 @Module, 316 @Provides — Hilt not yet adopted)
  async: RxJava 1.x/2.x/3.x (mixed, legacy) + Kotlin Coroutines + Flow
  code_quality: ktlint 12.1.0 + Android Lint + SonarQube

