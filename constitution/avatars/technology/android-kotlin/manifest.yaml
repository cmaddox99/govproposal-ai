    - "org.jetbrains.kotlinx:kotlinx-coroutines-android"
  data:
    - "androidx.room:room-ktx"
    - "com.squareup.retrofit2:retrofit: 2.9.0"
    - "com.squareup.okhttp3:okhttp: 4.10.0"
    - "com.squareup.moshi:moshi: 1.15.1"
  rx_legacy:
    - "io.reactivex:rxjava: 1.3.0"      # RxJava 1.x — still present
    - "io.reactivex.rxjava2:rxjava: 2.1.1" # RxJava 2.x — still present
    - "io.reactivex.rxjava3:rxjava: 3.0.0" # RxJava 3.x — 3 versions coexist; new code: Coroutines/Flow
  security:
    - "androidx.security:security-crypto"       # EncryptedSharedPreferences
    - "com.google.android.play:integrity"       # Play Integrity API
    - "com.google.firebase:firebase-crashlytics-gradle"
    - "com.google.firebase:perf-plugin"
  testing:
    unit:
      - "junit:junit: 4.13.2"              # JUnit 4 — dominant (not JUnit 5)
      - "io.mockk:mockk-android: 1.13.12"  # MockK
      - "app.cash.turbine:turbine: 1.1.0"  # Turbine for Flow testing
      - "org.robolectric:robolectric"
      - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
    ui:
      - "androidx.compose.ui:ui-test-junit4"
      - "androidx.test.espresso:espresso-core: 3.5.0"

