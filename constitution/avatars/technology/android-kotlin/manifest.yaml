conventions:
  naming:
    classes: PascalCase
    functions: camelCase
    properties: camelCase
    constants: SCREAMING_SNAKE_CASE  # companion object or top-level val
    packages: "com.aa.{module}  # e.g., com.aa.network2, com.aa.android.ui.american"
    test_functions: |
      # MIXED — both conventions present in codebase:
      # Underscore pattern (dominant — 582 occurrences): funGetAuthHeader_nullToken_expectEmpty()
      # Backtick pattern (289 occurrences): `adding item updates total`
      # New code SHOULD use backtick sentences (Philipp Hauer) for readability
    build_variants: "debug | qa | beta | betaRelease | release"
  patterns:
    entity: "data class (domain) or @Entity class (Room)"
    value_object: "@JvmInline value class"
    use_case: "class ...UseCase { operator fun invoke(...) }"
    repository_protocol: "interface ...Repository (domain layer)"
    repository_impl: "class ...RepositoryImpl @Inject constructor (data layer)"
    viewmodel: "class ...ViewModel @Inject constructor : ViewModel()  # Dagger 2 — no Hilt yet"
    ui_state: "sealed interface ...UiState { data object Loading; data class Success; data class Error }"
  test_idioms:
    # Per Philipp Hauer (KotlinConf 2018) — backtick naming is the target style
    # JUnit 4 is dominant (not JUnit 5) in live codebase
    instance_lifecycle: "class ...Test { private val dependency = mockk<Dependency>() }"
    mock_declaration: "private val dependency = mockk<Dependency>()"
    coroutine_test: "@get:Rule val coroutineRule = TestCoroutineRule()  # JUnit 4 rule style"
    flow_test: "flow.test { val item = awaitItem(); assertEquals(expected, item) }"
    nested_contexts: "# JUnit 4: inner class convention varies; backtick test names for context grouping"

commands:
  test:
    unit: "./gradlew testDebugUnitTest -Papp.isJenkins=true"
    unit_with_coverage: "./gradlew testDebugUnitTest testDebugUnitTestCoverage --no-daemon -Papp.isJenkins=true -Papp.writeToRemoteCache=true"
    single: "./gradlew :network2:testDebugUnitTest --tests '*.NetworkClientTest'"
    instrumented: "./gradlew connectedAndroidTest"
    coverage: "./gradlew jacocoTestReport"
  build:
    debug: "./gradlew app:assembleDebug --no-daemon -Papp.isJenkins=true -PbuildNumber=1"
    qa: "./gradlew app:assembleQa --no-daemon -Papp.isJenkins=true -PbuildNumber=1"
    beta: "./gradlew app:assembleBeta --no-daemon -Papp.isJenkins=true -PbuildNumber=1"
    release_bundle: "./gradlew app:bundleRelease"
  lint:
    android: "./gradlew lint"
    ktlint: "./gradlew ktlintCheck"
    sonar: "./gradlew sonarqube"
    constitution: "aa-constitution-lint ."

project_structure: |
  american-airlines-android/      # Multi-module monorepo (61 Gradle modules)
  ├── app/                        # Main application module
  │   └── src/
  │       ├── main/java/com/aa/android/
  │       │   ├── di/             # Dagger 2 @Component, @Module
  │       │   └── ui/
  │       ├── debug/              # Debug flavor sources
  │       ├── qa/                 # QA flavor sources
  │       ├── beta/               # Beta flavor sources
  │       └── androidTest/java/com/aa/android/di/  # Test DI components
  ├── core/                       # Core shared module
  ├── core_network/               # Network layer
  ├── core_base/                  # Base classes
  ├── core_business/              # Business logic
  ├── network2/                   # Network client (Retrofit + OkHttp + Moshi)
  │   └── src/test/java/com/aa/network2/  # JUnit 4 unit tests
  ├── ui/                         # UI components
  │   └── compose/                # Jetpack Compose components (808 files)
  ├── ui_american/                # AA-branded UI module
  ├── {feature}/                  # Feature modules (account, booking, checkin, etc.)
  │   └── src/
  │       ├── main/kotlin/com/aa/android/{feature}/
  │       └── test/kotlin/com/aa/android/{feature}/
  ├── lintchecks/                 # Custom Android Lint rules
  ├── gradle/
  │   ├── libs.versions.toml      # Version catalog (centralized deps)
  │   └── wrapper/
  ├── build.gradle                # Root Gradle (Groovy DSL)
  ├── settings.gradle             # Module declarations
  ├── buildall.sh                 # CI build script (-Papp.isJenkins=true)
  ├── sonarqube.gradle            # SonarQube quality gate config
  └── aa.yaml                     # AA metadata (squad, app)

compliance_domains:
  - mobile-ios
  - mobile-android
  - engineering
