    title: "Atomic TDD Law"
    example_file: examples/ENG-4.1-atomic-tdd.md
  - id: ENG-2.1
    title: "Domain-Driven Design Law"
    example_file: examples/ENG-2.1-ddd.md
  - id: ENG-3.1
