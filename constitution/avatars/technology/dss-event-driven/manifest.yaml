# DSS Event-Driven Microservices Avatar Manifest
avatar:
  id: avatar-tech-dss-event-driven
  type: technology
  name: "DSS Event-Driven Microservices"
  version: "1.0.0"

stack:
  language: "TypeScript / Node.js 20+ (primary), Java 17+ (processors), C# / .NET 8 (mgmt APIs)"
  framework: "Event-driven microservices (DisplayHub pattern)"
  testing:
    backend:
      - "Jest (Node.js services)"
      - "JUnit 5 + Mockito (Java/Spring processors)"
      - "xUnit + Moq (.NET management APIs)"
      - "Testcontainers (PostgreSQL, Redis, Service Bus emulator)"
    frontend:
      - "Jest + React Testing Library (React UIs)"
      - "Jasmine + Karma (Angular UIs)"
  persistence:
    - "PostgreSQL 15+ (durable state)"
    - "Redis (hot cache — sub-100ms reads)"
  messaging:
    - "Azure Service Bus (inter-service event delivery)"
    - "Azure Event Grid (external airline ops events)"

commands:
  test:
    node: "npm test"
    java: "./mvnw test jacoco:report"
    dotnet: "dotnet test --collect 'Code Coverage'"
  build:
    node: "npm run build"
    java: "./mvnw package -DskipTests"
    dotnet: "dotnet build"
  deploy: "kubectl apply -f k8s/ --namespace dss-prod"

activates:
  skills:
    - skill-06-atomic-tdd
    - skill-07-vertical-slice-dev
    - skill-08-code-review
    - skill-10-security-review
    - skill-14-real-time-data-integration
    - skill-27-constitution-compliance
  workflows:
    - greenfield-development
    - legacy-rescue-refactor

