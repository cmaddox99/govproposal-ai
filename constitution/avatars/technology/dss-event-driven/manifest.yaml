  - id: ENG-6.4
    title: "Data Protection Law"
    example_file: examples/ENG-6.4-data-protection.md
  - id: ENG-7.1
    title: "Failure Handling Law"
    example_file: examples/ENG-7.1-failure-handling.md
  - id: ENG-6.1
