# Legacy ML Interoperability Avatar Manifest
# Defines strategy and conventions for preserving legacy R/PySpark/notebook-based ML systems

avatar:
  id: avatar-legacy-ml-interop
  type: technology
  name: Legacy ML Interoperability
  version: "1.0.0"
  created: "2026-02-20"
  last_updated: "2026-02-20"

stack:
  preservation_languages:
    - R (statistical modeling, H2O)
    - PySpark (large-scale data processing)
    - Jupyter notebooks (ad-hoc analysis)
  interop_technologies:
    - Docker (containerization)
    - FastAPI (API wrappers)
    - Python (integration layer)
  testing:
    - pytest (regression tests)
    - pytest-cov (coverage)
    - requests (API client tests)

dependencies:
