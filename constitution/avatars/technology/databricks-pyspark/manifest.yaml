# Databricks / PySpark / Delta Lake Avatar Manifest

avatar:
  id: avatar-technology-databricks-pyspark
  type: technology
  name: "Databricks / PySpark / Delta Lake"
  version: "1.0.0"

stack:
  language: Python 3.10+
  frameworks:
    - PySpark
    - Delta Lake
    - MLflow
  sdk:
    - databricks-sdk>=0.76.0
  testing:
    - pytest>=8.3.0
    - pytest-cov
    - databricks-connect
  tools:
    formatter: ruff
    linter: ruff
    type_checker: mypy
    bundler: databricks-asset-bundles

dependencies:
  required:
    - pyspark: ">=3.5.0"
    - delta-spark: ">=3.2.0"
    - mlflow: ">=2.14.0"
    - databricks-sdk: ">=0.76.0"
  dev:
    - pytest: ">=8.3.0"
    - pytest-cov: ">=5.0.0"
    - databricks-connect: ">=15.0.0"
    - ruff: ">=0.4.0"
    - mypy: ">=1.10.0"

activates:
  skills:
    - skill-06-atomic-tdd
    - skill-07-vertical-slice-dev
    - skill-08-code-review
    - skill-04-business-domain-modeling
  workflows:
    - product-discovery-stage-a-f
    - greenfield-development

specializes_laws:
  - id: ENG-4.1
    title: Atomic TDD Law
    example_file: examples/ENG-4.1-atomic-tdd.md
  - id: ENG-6.1
    title: Security by Design
    example_file: examples/ENG-6.1-security-by-design.md
  - id: ENG-6.4
    title: Data Protection Law
    example_file: examples/ENG-6.4-data-protection.md
  - id: ENG-6.7
    title: Audit Trail Law
    example_file: examples/ENG-6.7-audit-trail.md
  - id: ENG-3.1
    title: Complexity Limits
    example_file: examples/ENG-3.1-complexity.md
  - id: ENG-5.1
    title: CI/CD Law
    example_file: examples/ENG-5.1-cicd.md
  - id: ENG-6.7
    title: Audit Trail Law (Engineering)
    example_file: examples/ENG-6.7-audit-trail.md

conventions:
  naming:
    python_modules: snake_case
    python_functions: snake_case
    python_classes: PascalCase
    constants: SCREAMING_SNAKE
    delta_tables: "snake_case with schema prefix (e.g., marketing.customer_offers)"
    mlflow_experiments: "/Users/<sp>/topml/<pipeline_name>"
    databricks_jobs: "snake_case (e.g., topml_offer_scoring_daily)"
  patterns:
    delta_table_as_repository: "Delta table replaces traditional DB repository pattern"
    mlflow_run_as_audit: "Each MLflow run is an immutable audit record of model execution"
    pure_transformations: "PySpark functions are pure — DataFrame in, DataFrame out, no side effects"
    secret_management: "All credentials via dbutils.secrets.get() — never .env files or hardcoded"

commands:
  test:
    all: pytest tests/
    verbose: pytest tests/ -v
    single: "pytest tests/test_transformations.py::test_apply_customer_offer_filter -v"
    coverage: pytest tests/ --cov=src --cov-report=html
  deploy:
    stage: databricks bundle deploy --target stage
    prod: databricks bundle deploy --target prod
    validate: databricks bundle validate
  lint:
    format: ruff format src/ tests/
    check: "ruff check src/ tests/ --fix"
    types: mypy src/ --strict

project_structure: |
  topml-offer-scoring/
  ├── databricks.yml                # Databricks Asset Bundle config (targets: dev/stage/prod)
  ├── src/
  │   └── topml/
  │       ├── __init__.py
  │       ├── transformations/      # Pure PySpark transformation functions
  │       │   ├── __init__.py
  │       │   ├── offer_filter.py   # apply_customer_offer_filter(), etc.
  │       │   └── feature_eng.py    # Feature engineering pure functions
  │       ├── models/               # MLflow model training + registration
  │       │   └── propensity.py
  │       ├── pipelines/            # Orchestration (calls transformations + models)
  │       │   └── scoring_pipeline.py
  │       └── audit/                # Audit log writers (append-only Delta)
  │           └── offer_audit.py
  ├── notebooks/                    # Databricks notebooks (orchestration only, no business logic)
  │   └── run_scoring_pipeline.py
  ├── tests/
  │   ├── conftest.py               # SparkSession fixture, Delta table fixtures
  │   ├── test_offer_filter.py
  │   ├── test_feature_eng.py
  │   └── test_scoring_pipeline.py
  ├── resources/                    # DAB resource definitions (jobs, clusters)
  │   └── jobs.yml
  └── pyproject.toml
