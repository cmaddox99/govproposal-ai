# ML/Analytics Avatar Manifest
# Defines stack configuration and law specializations

avatar:
  id: avatar-ml-analytics
  type: technology
  name: ML/Analytics
  version: "2.0.0"

stack:
  language: Python 3.11+
  frameworks:
    - scikit-learn
    - pandas
    - numpy
  testing:
    - pytest
    - pytest-cov
    - great_expectations
  tools:
    formatter: ruff
    linter: ruff
    type_checker: mypy
    experiment_tracking: mlflow

dependencies:
  required:
    - scikit-learn: ">=1.3.0"
    - pandas: ">=2.0.0"
    - numpy: ">=1.24.0"
    - mlflow: ">=2.9.0"
  dev:
    - pytest: ">=8.0.0"
    - pytest-cov: ">=4.1.0"
    - great-expectations: ">=0.18.0"
    - ruff: ">=0.1.0"
    - mypy: ">=1.8.0"

activates:
  skills:
    - skill-06-atomic-tdd
    - skill-04-business-domain-modeling
  workflows:
    - product-discovery-stage-a-f

specializes_laws:
  - id: ENG-4.1
    title: Atomic TDD Law
    example_file: examples/ENG-4.1-atomic-tdd.md
  - id: ENG-3.1
    title: Complexity Limits
    example_file: examples/ENG-3.1-complexity.md
  - id: ENG-6.1
    title: Observability Law
    example_file: examples/ENG-6.1-observability.md

conventions:
  naming:
    modules: snake_case
    functions: snake_case
    classes: PascalCase
    constants: UPPER_SNAKE
    features: snake_case
    models: descriptive

  patterns:
    transformer: "DataTransformer ABC with fit/transform"
    model: "class with fit/predict interface"
    experiment: "MLflow tracking wrapper"
    pipeline: "DVC pipeline definition"

commands:
  test:
    all: pytest
    coverage: pytest --cov=src --cov-report=html
    specific: pytest tests/models/test_classifier.py
    data_quality: pytest tests/data/
  dev:
    jupyter: jupyter lab
    mlflow_ui: mlflow ui
  pipeline:
    dvc_init: dvc init
    dvc_add: dvc add data/raw/orders.csv
    dvc_repro: dvc repro
    ge_init: great_expectations init
    ge_checkpoint: great_expectations checkpoint run orders_checkpoint

project_structure: |
  ml_project/
  ├── data/
  │   ├── raw/                    # Original, immutable data
  │   ├── interim/                # Intermediate processed data
  │   ├── processed/              # Final feature sets
  │   └── external/               # External data sources
  ├── models/
  │   ├── trained/                # Serialized trained models
  │   └── artifacts/              # Model artifacts, plots
  ├── notebooks/
  │   ├── 01-exploration.ipynb    # Data exploration
  │   ├── 02-feature-eng.ipynb    # Feature engineering
  │   └── 03-modeling.ipynb       # Model development
  ├── src/
  │   ├── data/
  │   │   ├── __init__.py
  │   │   ├── loaders.py          # Data loading utilities
  │   │   └── validators.py       # Data validation
  │   ├── features/
  │   │   ├── __init__.py
  │   │   └── transformers.py     # Feature transformations
  │   ├── models/
  │   │   ├── __init__.py
  │   │   ├── classifier.py       # Model implementation
  │   │   └── evaluation.py       # Evaluation metrics
  │   └── pipelines/
  │       ├── __init__.py
  │       ├── training.py         # Training pipeline
  │       └── inference.py        # Inference pipeline
  ├── tests/
  │   ├── data/
  │   │   └── test_validators.py
  │   ├── features/
  │   │   └── test_transformers.py
  │   ├── models/
  │   │   └── test_classifier.py
  │   └── conftest.py             # Shared fixtures
  ├── configs/
  │   ├── model_config.yaml       # Model hyperparameters
  │   └── feature_config.yaml     # Feature definitions
  ├── dvc.yaml                    # DVC pipeline definition
  ├── params.yaml                 # Experiment parameters
  ├── requirements.txt
  └── README.md
