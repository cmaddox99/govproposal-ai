domain:
  category: "Airport Ground Operations / ML-Driven Workforce Optimization"
  description: |
    American Airlines Ground Ops Staffing Analytics provides machine learning–driven
    decision support for airport ramp and baggage operations staffing. It predicts
    ground-crew requirements using historical bag scan events, flight data, and
    passenger manifests, enabling data-driven staffing plans at hub stations.
    Key value drivers include staffing accuracy (avoiding over/under-staffing),
    bag delivery reliability (pull-time SLAs), IROP resilience, and labor cost efficiency.

  personas:
    - "Ground Ops Analyst (Staffing Optimizer)"
    - "Ramp Operations Supervisor"
    - "Station Operations Manager"
    - "Airport Planning Engineer"
  personas_file: "examples/personas.md"

