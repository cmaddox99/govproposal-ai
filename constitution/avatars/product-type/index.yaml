# Product-Type Avatars Registry
# Domain-specific implementations of AA Product Laws (PRD)
# Enables selective loading of product guidance, examples, use-cases by domain

registry:
  name: AA Product-Type Avatars
  version: "2.0.0"
  base_constitution: ../../laws/index.yaml
  prd_reference: ../../docs/guides/avatars/prd-laws-reference.md
  description: Product-domain specializations of PRD-1.1 through PRD-5.1 laws

token_optimization:
  strategy: Selective document loading by law and use-case
  guidance_file: 750-800 tokens per PRD law application
  example_file: 750-800 tokens per discovery/journey/roadmap/metrics
  use_case_file: 1200-1500 tokens per phased workflow
  total_per_avatar: ~8000-12000 tokens for complete avatar

rag_structure:
  query_types:
    - "How do we discover customer needs for [product]?" → PRD-1.1 examples
    - "What's the user journey for [persona]?" → PRD-2.1 examples  
    - "What features should we prioritize?" → PRD-3.1 roadmap
    - "How do we validate this feature?" → PRD-4.1 use-cases
    - "What metrics define success?" → PRD-5.1 metrics
  retrieval_method: Cite specific file + law ID + snippet
  fallback: Load full guidance.md if context unclear

