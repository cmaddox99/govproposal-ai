# Discovery guidance for AI agents
ai_guidance:
  when_to_use_avatar: "Product manager designing feature for specific domain"
  entry_points:
    - "How do I discover needs for this product?" → Load PRD-1.1 example + guidance
    - "Which features should I prioritize?" → Load PRD-3.1 roadmap
    - "How do I validate before launch?" → Load PRD-4.1 use-case workflow
    - "What metrics define success?" → Load PRD-5.1 metrics framework
  
  selective_loading:
    - Use manifest.yaml to understand structure
    - Load guidance.md for law-specific context
    - Load specific example file based on PRD law question
    - Load use-case workflow for end-to-end execution
    - Fallback to PRD-LAWS-REFERENCE.md if unclear
  
  citation_format: "[PRD-N.N: Title](path/to/file.md) — {{ brief context }}"
