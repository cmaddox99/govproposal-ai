domain:
  category: "Product (Service Recovery)"
  description: |
    Crew Recovery Solver handles IROP crew reassignment when flights are cancelled,
    delayed, or disrupted. It presents evidence-scored recovery options while enforcing
    FAR Part 117 crew rest minimums as a hard safety constraint. Every assignment
    decision produces an immutable audit trail entry for regulatory review.
  personas:
    - Crew Scheduler (SOC — primary operator)
    - Crew Member (subject of reassignment)
    - FAA Compliance Analyst (audit and regulatory review)
    - Operations Manager (escalation and manual override)

core_journeys:
  - "Single flight cancellation — reassign all affected crew"
  - "Cascading delay reassignment across multi-leg trips"
  - "FAR 117 eligibility check before presenting recovery options"
  - "Manual override with compliance justification"
  - "Audit trail review for regulatory inquiry"

