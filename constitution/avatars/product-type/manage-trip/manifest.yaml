domain:
  category: "Post-Booking Reservation Management"
  description: |
    Manage-Trip owns the post-booking surface: everything a traveler needs to do
    after purchasing a ticket and before the boarding-pass phase. This includes
    trip cancellation and refund processing, lap infant addition, special service
    request (SSR) management, reservation contact information updates, and
    itinerary review. It operates on existing PNRs via BFF orchestration rather
    than initiating new bookings.

    Manage-Trip is distinct from:
    - passenger-booking: initial ticket purchase and seat selection at time of sale
    - check-in-travel: boarding pass issuance, day-of-travel status, and gate changes
    - schedule-change-self-serve: carrier-initiated disruption rebooking flows

    The domain is responsible for cancellation eligibility adjudication, DOT
    refund rule enforcement, PNR state retention after voluntary changes, and
    audit logging of all reservation mutations.
  personas:
    - Booked Traveler
    - Family Traveler (lap infant)
    - Business Traveler

core_journeys:
  - "Trip Cancellation & Refund"
  - "Lap Infant Addition"
  - "Reservation Contact Update"
  - "Special Service Request Management"
  - "Trip Details & Itinerary Review"

