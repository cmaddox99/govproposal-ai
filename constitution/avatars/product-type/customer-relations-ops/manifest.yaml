  last_updated: "2026-06-01"

domain:
  category: "Customer Relations Operations — AI-Assisted Complaint Response Drafting"
  description: |
    American Airlines Customer Relations Operations provides AI-assisted drafting
    support for Customer Relations Representatives (CR Reps) handling passenger
    complaints across hundreds of complaint categories.

    The system receives structured complaint records, applies PII redaction before
    any LLM interaction, executes a silent 3-stage compliance agent pipeline
    (Analysis → Compliance → Drafting), enforces template governance (compensation
    rules, prohibited language, trademark policies, liability constraints), and
    returns policy-compliant draft responses audited against an immutable trace log.

    Key differentiators:
    - Compliance-first: Company policy always outranks stylistic preferences
    - PII safety: Redacted before LLM call, restored only in final output
    - Silent orchestration: Only the final compliant draft is surfaced to the CR Rep
    - Audit immutability: Every LLM call and compensation decision is traced

  personas:
    - CR Specialist
    - CR Supervisor
    - Compliance Reviewer
  personas_file: "examples/personas.md"
  tech_notes:
    target_repo: "codebases/oraa/cr-genai-draft-response"
    tech_stack:
      - "Python 3.12"
      - "FastAPI"
      - "LangChain (core, openai, community)"
      - "Azure OpenAI Service"
      - "PostgreSQL + SQLAlchemy + asyncpg"
      - "OpenTelemetry (full distro)"
      - "structlog"
    preservation_policy: "Preserve all working compliance, PII, and audit patterns. Never change PII redaction/restoration pipeline, audit trace immutability, compensation validation rules, or prohibited-words enforcement without executive approval. Migration gate required for: complaint category/subcategory classification logic, 3-stage silent agent orchestration flow, PII encryption key management."

core_journeys:
  - "Complaint Intake and Category Classification"
  - "Template Selection and Compensation Validation"
  - "PII-Safe LLM Draft Generation"
  - "Draft Review, Edit, and Acceptance"
  - "Case Close and Audit Trace"

activates:
  skills:
    - spec-governance
    - 04-business-domain-modeling
    - 05-business-rules
    - 06-atomic-tdd
    - 07-vertical-slice-dev
    - 08-code-review
