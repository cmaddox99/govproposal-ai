avatar:
  id: avatar-product-network-automation
  type: product
  name: "Network Automation"
  version: "1.0.0"
  created: "2026-04-28"
  last_updated: "2026-04-28"

domain:
  category: "Product (Internal Operations)"
  description: |
    Network Automation governs AI-assisted development of IT network infrastructure tooling
    at American Airlines — spanning Nautobot-driven device management, DNS lifecycle,
    firewall rule management, network monitoring, and PaaS subnet provisioning.
    Every automated network change must satisfy IT change management controls and produce
    a complete audit trail before device configuration is applied.
  personas:
    - Network Engineer
    - NOC Operator
    - Platform/Cloud Engineer
    - IT Change Manager
  personas_file: "examples/personas.md"

core_journeys:
  - "Network change request — Nautobot inventory to device push"
  - "DNS record lifecycle — create, update, delete via Apigee API"
  - "Firewall rule lifecycle — request, approve, push, audit"
  - "Network health monitoring and alert response (MOCCA/Eagle Eye)"
  - "PaaS subnet provisioning"

activates:
  skills:
    - skill-spec-governance
    - skill-02-user-journey-mapping
    - skill-03-executable-spec
    - skill-13-observability
    - skill-11-incident-response
    - skill-27-constitution-compliance
  workflows:
    - product-discovery-stage-a-f
    - avatar-workflow

