      manifest: manifest.yaml
      guidance: guidance.md
    specializes_laws:
    - ENG-10.1: 'Brownfield Preservation (default: containerize, not rewrite)'
    - ENG-4.1: Atomic TDD for Regression (validate output parity with legacy code)
    - ENG-2.2: Layered Architecture (presentation → API → legacy execution)
    - ENG-6.5: Input Validation (validate at API boundary before subprocess calls)
    search_queries:
    - How to preserve legacy R models? → ENG-10.1 + guidance (1800 tokens)
