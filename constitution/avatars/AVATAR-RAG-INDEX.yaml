            - refs/language/ref-concurrency-advanced-part2.md
          avoid: []
      unknown_fallback: legacy-safe

    use_cases:
      - Brownfield C++ modernization with non-rewrite safeguards
      - Safety-critical systems with sanitizer-gated CI pipeline
      - High-performance services with ownership-first memory safety
      - Cross-language alignment with Java/Python/Node governance parity
      - Async service with coroutine-based I/O and cancellation support
      - Performance-critical allocator-tuned data processing
      - Shared library API with ABI stability governance
      - Legacy C++ codebase onboarding for new engineers
      - C++ service with resiliency patterns (circuit breakers, retries)

    anti_patterns:
      - DO NOT use raw new/delete — use std::unique_ptr or std::shared_ptr with RAII
      - DO NOT access buffers without bounds — use std::span for non-owning views
      - DO NOT put logic in free functions with public structs — encapsulate in DDD aggregates
      - DO NOT call mutex.lock()/unlock() directly — use std::lock_guard or std::scoped_lock
      - DO NOT use C-style casts — use static_cast/dynamic_cast, localize reinterpret_cast behind unsafe boundaries
      - DO NOT skip sanitizer builds in CI — ASan + UBSan are mandatory gate checks
      - DO NOT declare throwing move constructors — move operations must be noexcept
      - DO NOT launch fire-and-forget coroutines — require cancellation and error propagation
      - DO NOT log PII in plaintext — use masking functions at the logging boundary
      - DO NOT store string_view/span across scope boundaries — views can dangle
      - DO NOT use signed integer arithmetic without overflow protection — UB risk
      - DO NOT access objects after std::move — moved-from state is unspecified
      - DO NOT allow exceptions to escape destructors — std::terminate will crash the process
      - DO NOT block inside coroutines or thread pools — use async I/O primitives
      - DO NOT use GPL libraries without architecture review — copyleft risk
      - DO NOT use std::auto_ptr — replace with std::unique_ptr (deprecated C++11, removed C++17)
      - DO NOT use SFINAE (enable_if) in new code when concepts are available — migrate incrementally
      - DO NOT rewrite legacy modules wholesale — use phased modernization per brownfield governance
      - DO NOT mix C++ standard versions without documented CMAKE_CXX_STANDARD per target
      - DO NOT skip characterization tests before modifying legacy code
      # Novice guidance anti-patterns (Amendment I)
      - DO NOT modify legacy code without characterization tests capturing existing behavior first
      - DO NOT clean up code in modules you are not actively modifying — Boy Scout Rule scoped to touched lines only
      - DO NOT allow god classes (>2000 LOC) — extract by responsibility
      - DO NOT tolerate implicit conversions from single-argument constructors — mark explicit

