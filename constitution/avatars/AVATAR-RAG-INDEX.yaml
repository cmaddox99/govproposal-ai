    - Containerize legacy R statistical models for API consumption
    - Wrap PySpark optimization pipelines with FastAPI
    - Extract reusable logic from Jupyter notebooks to tested modules
    - Build Streamlit dashboards calling containerized legacy models
    preservation_policy:
      default_strategy: Preserve with containerization—no rewrite without validation
      preserve_when:
      - Legacy model has validated accuracy and stakeholder trust
      - Domain logic is complex and poorly documented (rewrite risk high)
      - Time-to-market critical (containerization 1-2 weeks vs rewrite 8-12 weeks)
      migrate_when:
      - New model demonstrates 10%+ accuracy improvement (validated)
      - New model demonstrates 50%+ performance improvement (validated)
      - Legacy maintainability cost > migration cost + stakeholder approval
      never_migrate_without:
      - Stakeholder signoff from model owners and users
      - Side-by-side validation tests (output parity within 1% tolerance)
      - Regression test suite covering critical use cases
      - Rollback plan (keep containerized legacy model deployable)
