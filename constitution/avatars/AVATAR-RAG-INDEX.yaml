    version_routing_policy:
      # Activated when .copilot/project.yaml, CMakeLists.txt, .vcxproj, Makefile, or .dsp signals a C++ standard tier.
      # Agent MUST prefer the refs listed below INSTEAD of default ref selection when tier is known.
      # Conservative default: if example cpp_version_min > declared cpp.standard (or tier), warn; do not silently serve.
      # Unknown/no-signal fallback: apply legacy-safe routing and prompt user for confirmation.
      detection_order:
        - signal: ".copilot/project.yaml"
          field: "cpp.standard"
        - signal: "CMakeLists.txt"
          field: "CMAKE_CXX_STANDARD"
        - signal: "*.vcxproj / *.props"
          field: "<LanguageStandard>"
        - signal: "Makefile"
          pattern: "-std=c++XX"
        - signal: "*.dsp / *.dsw"
          result: "legacy"
      by_standard:
        legacy:
          standards: ["pre98"]
          prefer:
            - refs/legacy/ref-brownfield-survival.md
            - refs/legacy/ref-brownfield-coplien.md
            - refs/legacy/ref-legacy-navigation.md
            - refs/legacy/ref-mental-models-lang.md
            - refs/legacy/ref-legacy-smells-structural.md
            - refs/legacy/ref-concurrency-brownfield.md
          avoid:
            - examples/ENG-6.7-audit-trail.md
            - examples/ENG-3.7-error-handling.md
            - examples/ENG-2.1-aggregates.md
        brownfield:
          standards: ["98", "03"]
          prefer:
            - refs/legacy/ref-brownfield-survival.md
            - refs/legacy/ref-legacy-navigation.md
            - refs/legacy/ref-brownfield-adoption.md
