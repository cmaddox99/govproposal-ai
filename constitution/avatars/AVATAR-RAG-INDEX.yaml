version: 2.0.0
name: Avatar RAG Index
created: '2026-02-20'
updated: '2026-02-20'
rag_config:
  embedding_model: text-embedding-3-large
  chunk_strategy: Selective document loading (guidance + specific example + use-case)
  max_tokens_per_query: 2000-3500 (context window optimized)
  recall_target: 95%+ for product domain queries
  precision_target: 90%+ (minimal false positives)
  search_tiers:
    tier_1_exact: Direct law reference (e.g., "PRD-3.1") → Load specific law example
    tier_2_semantic: Topic query (e.g., "How do we discover customer needs?") → Load PRD-1.1 + guidance
    tier_3_use_case: Scenario query (e.g., "First-time booking workflow") → Load use-case + manifest
    tier_4_fallback: Ambiguous query → Load guidance.md + offer clarification
token_optimization:
  guidance_file: guidance.md (index) 200-450 tokens; ref-*.md (split reference files, on-demand) no limit
  example_file: 750-800 tokens per PRD law (1.1-5.1)
  use_case_file: 1200-1500 tokens per full workflow
  manifest_file: 100 tokens per manifest.yaml
  total_selective: 3000-4000 tokens per query (vs. 8000-12000 for full avatar)
  efficiency_gain: 60-67% token reduction
