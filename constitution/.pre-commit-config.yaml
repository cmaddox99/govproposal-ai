# Pre-commit hooks for hangar-ai-constitution
# See https://pre-commit.com for more information

repos:
  # AA Constitution Lint - enforces Constitutional compliance
  - repo: local
    hooks:
      - id: aa-constitution-lint
        name: AA Constitution Lint
        description: Check project compliance with hangar-ai-constitution laws
        entry: python3 -m aa_constitution_lint.cli
        language: system
        types: [file]
        pass_filenames: false
        always_run: true
        verbose: true

  # Standard Python hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Python formatting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
