name: Constitution Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/constitution-lint/pyproject.toml

      - name: Install aa-constitution-lint
        run: pip install -e tools/constitution-lint

      - name: Run constitution lint
        id: lint
        run: |
          set +e
          aa-constitution-lint . --constitution . --format json > lint-output.json 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lint-output.json

      - name: Post PR comment with violation summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const raw = fs.readFileSync('lint-output.json', 'utf8');
              const data = JSON.parse(raw);
              const summary = data.summary || {};
              const violations = data.violations || [];
              const lines = [
                '## 📋 Constitution Lint Results',
                '',
                `| Metric | Count |`,
                `|--------|-------|`,
                `| ✅ Passed | ${summary.passed ?? 0} |`,
                `| ❌ Failed | ${summary.failed ?? 0} |`,
                `| ⚠️ Warnings | ${summary.warnings ?? 0} |`,
                `| ⏭️ Skipped | ${summary.skipped ?? 0} |`,
                `| 📊 Total | ${summary.total ?? 0} |`,
              ];
              if (violations.length > 0) {
                lines.push('', '### Violations', '');
                for (const v of violations.slice(0, 20)) {
                  const loc = v.file_path ? ` \`${v.file_path}\`` : '';
                  lines.push(`- **${v.law_id}**${loc}: ${v.message}`);
                }
                if (violations.length > 20) {
                  lines.push(`- _…and ${violations.length - 20} more violations_`);
                }
              }
              body = lines.join('\n');
            } catch (e) {
              body = `## 📋 Constitution Lint Results\n\nFailed to parse lint output: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if lint errors found
        if: steps.lint.outputs.exit_code != '0'
        run: |
          echo "Constitution lint failed with exit code ${{ steps.lint.outputs.exit_code }}"
          exit 1
